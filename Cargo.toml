[package]
name = "spatial-os"
version = "0.1.0"
edition = "2024"

[lib]
name = "spatial_os"
path = "src/lib.rs"

[dependencies]
adk-agent = { path = "../adk-rust/adk-agent" }
adk-awp = { path = "../adk-rust/adk-awp" }
adk-core = { path = "../adk-rust/adk-core" }
adk-model = { path = "../adk-rust/adk-model", features = ["gemini"] }
adk-runner = { path = "../adk-rust/adk-runner" }
adk-session = { path = "../adk-rust/adk-session" }
adk-tool = { path = "../adk-rust/adk-tool", features = ["mcp"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
dotenvy = "0.15"
futures = "0.3"
rmcp = { version = "1.3.0", features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"