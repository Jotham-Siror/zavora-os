# MCP Registry-compatible tool allowlists per sub-agent (BK-011).
# Discovery ≠ exposure: agents only receive tools listed for their agent id.

[[allowlist]]
agent = "excel_agent"
mcp_server = "worksheet"
reason = "Deck revenue spreadsheet — write-only workbook tools"
tools = [
  "create_workbook",
  "open_workbook",
  "save_workbook",
  "write_cells",
  "write_column",
  "write_row",
  "add_chart",
  "describe_workbook",
  "list_sheets",
  "set_cell_format",
]

